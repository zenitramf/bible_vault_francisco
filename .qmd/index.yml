# Project-local qmd index config for the Bible Vault.
#
# Path note: on-disk folders use underscores (e.g. sources/commentaries_english/).
# qmd collection-relative paths often normalize separators to hyphens in URIs
# (qmd://bible-sources/commentaries-english/...). Wiki wikilinks must keep the
# real disk path under sources/. Use qmd ls / qmd search output for qmd URIs.
#
# Models: only the embed model is used routinely. Query-expansion (generate) and
# rerank models are pinned for compatibility but must not be loaded by default
# on this host — use .qmd/bin/*-safe wrappers, not bare qmd query/vsearch/bench.

global_context: |
  A bilingual English and Spanish Bible-study knowledge base. Prefer the maintained wiki for synthesized answers. Consult source documents for verification, direct evidence, disagreements, and deeper context. Treat sources as immutable. Prefer wiki/catalog.jsonl (search-catalog) before broad source BM25 when looking for compiled themes, tags, or Bible references.

collections:
  bible-wiki:
    path: /home/hermes/bible_vault_francisco/wiki
    pattern: "**/*.md"
    ignore:
      - "**/index.md"
      - log.md
      - "indexes/**"
    includeByDefault: true
    context:
      /: LLM-maintained, source-backed synthesis for the Bible vault. Pair with wiki/catalog.jsonl for structured retrieval.
      /concepts: Biblical doctrines, themes, and practices.
      /people: Biblical people and relevant historical figures.
      /passages: Syntheses organized around biblical passages.
      /questions: Durable investigations, comparisons, and answered questions.
      /source-notes: Summaries and evaluations of intentionally ingested sources.

  bible-sources:
    path: /home/hermes/bible_vault_francisco/sources
    pattern: "**/*.md"
    ignore:
      - "**/index.md"
    includeByDefault: false
    context:
      /: Immutable primary and secondary Bible-study source documents. Lexical (BM25) only on this server unless a bounded pilot is approved.
      /commentaries_english/mhenry-complete: Complete Matthew Henry Bible commentary (disk path; qmd URI may show commentaries-english).
      /commentaries_english/mhenry-concise: Concise Matthew Henry Bible commentary.
      /commentaries_english/chspurgeon-sermons: Charles Spurgeon sermons.
      /commentaries_english/chspurgeon-tod: Charles Spurgeon's Treasury of David.
      /commentaries_english/chspurgeon-fcb: Charles Spurgeon's Faith's Checkbook devotionals.
      /commentaries_english/chspurgeon-mae: Charles Spurgeon's Morning and Evening devotionals.
      /personal-notes: Personal English and Spanish Bible-study, devotional, and ministry notes.
      /articles: Staged or collected articles (sparse).
      /books: Staged or collected books (sparse).
      /transcripts: Staged or collected transcripts (sparse).

  # Bounded embedding pilot only — never expand to full bible-sources without approval.
  bible-personal-notes:
    path: /home/hermes/bible_vault_francisco/sources/personal-notes
    pattern: "**/*.md"
    ignore:
      - "**/index.md"
    includeByDefault: false
    context:
      /: Small personal-notes corpus for optional vector pilot. Prefer bible-sources BM25 for commentary; use this collection only when personal-note semantics matter.

models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
