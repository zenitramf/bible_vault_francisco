[project]
name = "bible-vault-tools"
version = "0.1.0"
description = "Qdrant Cloud and helper scripts for the Bible Vault (Cloud Inference)."
requires-python = ">=3.11"
dependencies = [
  "qdrant-client>=1.12",
]

[project.optional-dependencies]
# Offline E5 self-test only (.qmd/bin/e5-encode); not required for upsert/search.
e5-local = [
  "fastembed>=0.4",
  "onnxruntime>=1.17",
  "numpy>=1.26",
  "tokenizers>=0.19",
  "huggingface_hub>=0.23",
]

[tool.uv]
package = false
